name: Build dylib

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode
        run: |
          xcodebuild -version
          echo "SDK=$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang++ --version

      - name: List sources
        run: |
          ls -la
          ls -la src include
          wc -l src/*.mm include/*.h

      - name: Build
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          set +e
          xcrun -sdk iphoneos clang++ \
            -std=c++17 \
            -fobjc-arc \
            -fexceptions \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -I"$PWD/include" \
            -fvisibility=hidden \
            -dynamiclib \
            -install_name @rpath/AstralCheat.dylib \
            -Wl,-undefined,dynamic_lookup \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            -o out/AstralCheat.dylib \
            src/Menu.mm \
            src/Features.mm \
            > build.log 2>&1
          RC=$?
          set -e
          echo "clang exit=$RC"
          echo "===== build.log ====="
          cat build.log
          if [ "$RC" -ne 0 ]; then
            echo "BUILD FAILED"
            exit $RC
          fi
          ls -lh out/AstralCheat.dylib
          cp out/AstralCheat.dylib AstralCheat.dylib
          echo "BUILD OK"

      - name: Upload logs always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            AstralCheat.dylib
            out/AstralCheat.dylib
          if-no-files-found: ignore

      - name: Upload dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AstralCheat.dylib
          path: AstralCheat.dylib
          if-no-files-found: error
