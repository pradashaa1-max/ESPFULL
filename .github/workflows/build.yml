name: Build dylib

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project root
        id: root
        run: |
          set -e
          echo "== pwd =="
          pwd
          echo "== ls =="
          ls -la
          if [ -f src/Menu.mm ] && [ -f src/Features.mm ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
            echo "Project at repo root"
          elif [ -f astral_full/src/Menu.mm ]; then
            echo "root=astral_full" >> "$GITHUB_OUTPUT"
            echo "Project in astral_full/"
          else
            echo "Sources not found"
            find . -name "*.mm" 2>/dev/null | head -30
            exit 1
          fi

      - name: Show sources
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          echo "== tree =="
          ls -la
          ls -la src include 2>/dev/null || true
          wc -l src/*.mm include/*.h 2>/dev/null || true

      - name: Xcode info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun -sdk iphoneos clang++ --version

      - name: Build dylib
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          mkdir -p out
          xcrun -sdk iphoneos clang++ \
            -std=c++17 \
            -fobjc-arc \
            -fexceptions \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -I./include \
            -fvisibility=hidden \
            -dynamiclib \
            -install_name @rpath/AstralCheat.dylib \
            -Wl,-undefined,dynamic_lookup \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            -o out/AstralCheat.dylib \
            src/Menu.mm \
            src/Features.mm \
            2>&1 | tee build.log
          echo "== result =="
          ls -lh out/AstralCheat.dylib
          file out/AstralCheat.dylib
          cp out/AstralCheat.dylib "$GITHUB_WORKSPACE/AstralCheat.dylib"

      - name: On failure show log
        if: failure()
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          echo "########## build.log ##########"
          cat build.log 2>/dev/null || echo "(no build.log)"
          echo "########## sources ##########"
          ls -la src include 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build.log
            AstralCheat.dylib
          if-no-files-found: ignore

      - name: Upload dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AstralCheat.dylib
          path: AstralCheat.dylib
          if-no-files-found: error
