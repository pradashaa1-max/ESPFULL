name: mark · antilose64 (darling)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build mark.dylib
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode / SDK
        run: |
          xcodebuild -version
          echo "SDK=$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang++ --version

      - name: Sources
        run: |
          ls -la
          ls -la src include || true
          wc -l src/*.mm include/*.h || true

      - name: Build mark.dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          set +e
          xcrun -sdk iphoneos clang++ \
            -std=c++17 \
            -fobjc-arc \
            -fexceptions \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -I"$PWD/include" \
            -fvisibility=hidden \
            -dynamiclib \
            -install_name @rpath/mark.dylib \
            -Wl,-undefined,dynamic_lookup \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            -o out/mark.dylib \
            src/Menu.mm \
            src/Features.mm \
            > build.log 2>&1
          RC=$?
          set -e
          echo "clang exit=$RC"
          echo "===== build.log ====="
          cat build.log
          if [ "$RC" -ne 0 ]; then
            echo "BUILD FAILED"
            exit $RC
          fi
          ls -lh out/mark.dylib
          cp out/mark.dylib mark.dylib
          echo "mark (antilose64) darling — BUILD OK"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-build-logs
          path: |
            build.log
            mark.dylib
            out/mark.dylib
          if-no-files-found: ignore

      - name: Upload mark.dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mark-antilose64-darling
          path: mark.dylib
          if-no-files-found: error
